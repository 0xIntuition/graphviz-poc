query ClaimsFromFollowing($address: String!) {
  claims_from_following(args: { address: $address }
  order_by: [ {
     shares: desc
  }]
  ) {
    shares
    triple {
      id
      subject {
        id
        label
      }
      predicate {
        id
        label
      }
      object {
        id
        label
      }
    }
    account {
      id
      label
    }
  }
}